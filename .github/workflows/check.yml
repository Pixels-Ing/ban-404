name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lancer check.sh
        run: bash check.sh

  # Test d'intégration : verrouille le comportement de RÉFÉRENCE (Apache/ISPConfig + ipset/iptables)
  # pour détecter toute régression avant l'universalisation. Voir tests/integration.sh.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer ipset + iptables
        run: sudo apt-get update && sudo apt-get install -y ipset iptables
      - name: Lancer le test d'intégration (dry-run + ban/unban réel)
        run: sudo bash tests/integration.sh ./ban_404.sh

  # Backend nftables (opt-in) + bascule migratoire iptables -> nft. Le runner Ubuntu porte ipset,
  # iptables ET nft => on peut valider le backend nft ET la migration one-shot. Voir tests/integration_nft.sh.
  integration-nft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer ipset + iptables + nftables + gawk
        run: sudo apt-get update && sudo apt-get install -y ipset iptables nftables gawk
      # Forcer gawk comme awk par défaut : le runner Ubuntu utilise mawk, plus permissif ; gawk
      # rejette p.ex. une variable nommée « exp » (fonction intégrée) — on veut attraper ces bugs
      # de portabilité awk en CI (incident constaté en production, moteur 2.1.2).
      - name: Forcer gawk comme awk par défaut
        run: sudo update-alternatives --set awk /usr/bin/gawk
      - name: Lancer le test d'intégration nft (backend nft + bascule, sous gawk)
        run: sudo bash tests/integration_nft.sh ./ban_404.sh
